# Kernel and diagnostics
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=0
CONFIG_THREAD_NAME=y
CONFIG_ASSERT=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_INIT_STACKS=y
CONFIG_TIMESLICING=n

# Cortex-M4F floating-point estimator
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_PICOLIBC=y

# Console/logging on the existing UART4 debug header
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3

# ODIN peripherals
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_CAN=y
CONFIG_WATCHDOG=y
CONFIG_FLASH=y
CONFIG_SPI_NOR=y

# Static allocation only; queues and thread stacks are compile-time objects.
CONFIG_HEAP_MEM_POOL_SIZE=0
